name: Build and test PRs

on:
  pull_request:

jobs:
  checks:
    name: Build and test PR
    runs-on: ubuntu-latest
    environment: testing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Build the Docker image
        run: |
          set -e
          echo "Building Docker image."
          docker build -t pmc-www:${{ github.event.pull_request.number }} .
          echo "Docker image successfully created."

      - name: Verify Docker image
        run: |
          set -e
          echo "Verifying Docker image exists..."
          docker images pmc-www:${{ github.event.pull_request.number }}
          echo "Docker image verified."

      - name: Remove Docker image
        run: |
          set -e
          echo "Deleting Docker image..."
          docker rmi pmc-www:${{ github.event.pull_request.number }}
          echo "Docker image deleted."
