name: Build and Deploy to Cloud Run (STAGING)

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.PROJECT_ID }}
  APP_NAME: ${{ secrets.APP_NAME }}
  REGION: us-west1

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log into Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCLOUD_AUTH }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Cloud Build
        run: gcloud builds submit --project ${{ env.PROJECT_ID }} --tag gcr.io/${{ env.PROJECT_ID }}/${{ env.APP_NAME }}

      - name: Deploy to Cloud Run
        run: |
          gcloud config set project ${{ env.PROJECT_ID }}
          gcloud run deploy ${{ env.APP_NAME }} --image gcr.io/${{ env.PROJECT_ID }}/${{ env.APP_NAME }} --region ${{ env.REGION }} --allow-unauthenticated

      - name: Print the staging URL
        run: |
          URL=$(gcloud run services describe ${{ env.APP_NAME }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "Staging: $URL"
          echo "### Staging: $URL" >> "$GITHUB_STEP_SUMMARY"
