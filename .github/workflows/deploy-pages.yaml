name: Deploy staging to GitHub Pages

# Every push to main publishes the site to https://<org>.github.io/www/ as a shareable staging link.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Catch a build whose images or Geary model would 404 under the base path before it goes live
      - name: Check asset paths
        env:
          BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          set -e
          test -f out/models/geary.glb
          # images and the Geary model share asset(), so a prefixed <img> means the model URL is prefixed too
          grep -q "src=\"$BASE/brand/pmc-logo" out/index.html || { echo "asset URLs are missing the '$BASE' prefix"; exit 1; }
          echo "Assets are served under '$BASE/'"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
