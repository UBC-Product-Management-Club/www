name: Deploy ubcpmc.com (prod + staging)

# Two branches, one Pages site:
#   staging → https://ubcpmc.com/<secret path>/   push here to try changes
#   main    → https://ubcpmc.com                  prod; only changes by merging a pull request from staging
# A repo has a single Pages site, so every deploy builds both branches into it: main at the root, staging under a
# random path kept in the STAGING_PATH secret, so it can't be found from this public repo, and marked noindex.
# Pushing either branch republishes both, so they never drift apart. To move staging, change the secret.
# One-time setup: Settings → Pages → Source "GitHub Actions"; Settings → Environments → github-pages allows the
# main and staging branches to deploy.
on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build prod and staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main (prod)
        uses: actions/checkout@v4
        with:
          ref: main
          path: prod

      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          path: staging

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            prod/package-lock.json
            staging/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build prod
        working-directory: prod
        run: npm ci && npm run build
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_BASE_PATH: ""

      - name: Build staging
        working-directory: staging
        run: npm ci && npm run build
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_BASE_PATH: /${{ secrets.STAGING_PATH }}

      # Catch a build whose images or Geary model would 404 under its base path before it goes live
      - name: Check asset paths
        env:
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          set -e
          test -n "$STAGING_PATH" || { echo "Set the STAGING_PATH secret"; exit 1; }
          for site in "prod:" "staging:/$STAGING_PATH"; do
            dir=${site%%:*}; base=${site#*:}
            test -f $dir/out/models/geary.glb
            # images and the Geary model share asset(), so a prefixed <img> means the model URL is prefixed too
            grep -q "src=\"$base/brand/pmc-logo" $dir/out/index.html || { echo "$dir: asset URLs are missing their base path"; exit 1; }
          done

      # no robots.txt entry for staging: it would publish the path. Its pages carry noindex instead.
      - name: Put staging under its secret path
        env:
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: cp -R staging/out "prod/out/$STAGING_PATH"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./prod/out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
